name: Tests

# запускаем тесты при каждом пуше и при pull request
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Поставить python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Запустить тесты
        run: pytest -v
